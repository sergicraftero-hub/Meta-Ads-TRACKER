# One-click deploy on Render (render.com → New → Blueprint). Fill the secret env vars in the dashboard.
services:
  - type: web
    name: adpilot
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adpilot-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: adpilot-db
    plan: basic-256mb
